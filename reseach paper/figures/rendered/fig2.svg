<text x="303.0" y="25.0" fill="#141414" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.6" font-weight="700">3. FTS5 ID gate</text>
<text x="303.0" y="36.0" fill="#141414" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.6" font-weight="400">Scoped match exists</text>
<rect x="253" y="73" width="100" height="35" rx="4" fill="rgb(245,245,245)" stroke="#404040" stroke-width=".65"/>
<text x="303.0" y="88.0" fill="#141414" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.6" font-weight="700">4. Expand peers</text>
<text x="303.0" y="99.0" fill="#141414" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.6" font-weight="400">Filter predicate and unit</text>
<rect x="130" y="73" width="100" height="35" rx="4" fill="rgb(245,245,245)" stroke="#404040" stroke-width=".65"/>
<text x="180.0" y="88.0" fill="#141414" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.6" font-weight="700">5. Compare authority</text>
<text x="180.0" y="99.0" fill="#141414" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.6" font-weight="400">Strongest tier</text>
<rect x="7" y="73" width="100" height="35" rx="4" fill="rgb(245,245,245)" stroke="#404040" stroke-width=".65"/>
<text x="57.0" y="88.0" fill="#141414" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.6" font-weight="700">6. Compare values</text>
<text x="57.0" y="99.0" fill="#141414" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.6" font-weight="400">Exact Auditor decision</text>
<rect x="7" y="137" width="100" height="35" rx="4" fill="rgb(245,245,245)" stroke="#404040" stroke-width=".65"/>
<text x="57.0" y="152.0" fill="#141414" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.6" font-weight="700">7. Verify support</text>
<text x="57.0" y="163.0" fill="#141414" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.6" font-weight="400">Revision, span, hash</text>
<rect x="130" y="137" width="100" height="35" rx="4" fill="rgb(245,245,245)" stroke="#404040" stroke-width=".65"/>
<text x="180.0" y="152.0" fill="#141414" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.6" font-weight="700">8. Emit and store</text>
<text x="180.0" y="163.0" fill="#141414" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.6" font-weight="400">Answer or abstention</text>
<rect x="253" y="137" width="100" height="35" rx="4" fill="rgb(245,245,245)" stroke="#404040" stroke-width=".65"/>
<text x="303.0" y="152.0" fill="#141414" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.6" font-weight="700">9. Inspect later</text>
<text x="303.0" y="163.0" fill="#141414" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.6" font-weight="400">Reapply READ and hash</text>
