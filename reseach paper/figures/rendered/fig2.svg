<svg xmlns="http://www.w3.org/2000/svg" width="360" height="198" viewBox="0 0 360 198" role="img"><title>Strict policy path with authorization, peer selection, abstention, and exact-span verification</title>
<rect x="7" y="10" width="100" height="35" rx="4" fill="rgb(245,245,245)" stroke="#404040" stroke-width=".65"/>
<text x="57.0" y="25.0" fill="#141414" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.6" font-weight="700">1. Session and action</text>
<text x="57.0" y="36.0" fill="#141414" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.6" font-weight="400">Require query.execute</text>
<rect x="130" y="10" width="100" height="35" rx="4" fill="rgb(227,227,227)" stroke="#404040" stroke-width=".65"/>
<text x="180.0" y="25.0" fill="#141414" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.6" font-weight="700">2. Eligibility predicate</text>
<text x="180.0" y="36.0" fill="#141414" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.6" font-weight="400">READ, approved, valid</text>
