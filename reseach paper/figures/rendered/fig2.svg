<svg xmlns="http://www.w3.org/2000/svg" width="360" height="218" viewBox="0 0 360 218" role="img"><title>Ordered strict policy admission, FTS identifier gate, peer expansion and verification</title>
<rect x="7" y="8" width="100" height="42" rx="3" fill="#edf3f7" stroke="#516775" stroke-width=".8"/>
<text x="57.0" y="26.5" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700">1. Authenticate</text>
<text x="57.0" y="37.5" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="400">Authorize query</text>
<rect x="130" y="8" width="100" height="42" rx="3" fill="#def1ea" stroke="#516775" stroke-width=".8"/>
<text x="180.0" y="26.5" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700">2. Admit evidence</text>
<text x="180.0" y="37.5" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="400">READ, approval, scope</text>
<rect x="253" y="8" width="100" height="42" rx="3" fill="#edf3f7" stroke="#516775" stroke-width=".8"/>
<text x="303.0" y="26.5" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700">3. Filter valid time</text>
<text x="303.0" y="37.5" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="400">Apply effective window</text>
<rect x="253" y="75" width="100" height="42" rx="3" fill="#edf3f7" stroke="#516775" stroke-width=".8"/>
<text x="303.0" y="93.5" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700">4. FTS5 ID gate</text>
<text x="303.0" y="104.5" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="400">Eligible hit required</text>
<rect x="130" y="75" width="100" height="42" rx="3" fill="#def1ea" stroke="#516775" stroke-width=".8"/>
<text x="180.0" y="93.5" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700">5. Expand peers</text>
<text x="180.0" y="104.5" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="400">Predicate and unit</text>
<rect x="7" y="75" width="100" height="42" rx="3" fill="#edf3f7" stroke="#516775" stroke-width=".8"/>
<text x="57.0" y="93.5" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700">6. Compare rank</text>
<text x="57.0" y="104.5" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="400">Use strongest tier</text>
<rect x="7" y="142" width="100" height="42" rx="3" fill="#edf3f7" stroke="#516775" stroke-width=".8"/>
<text x="57.0" y="160.5" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700">7. Compare values</text>
<text x="57.0" y="171.5" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="400">Check Auditor choice</text>
<rect x="130" y="142" width="100" height="42" rx="3" fill="#def1ea" stroke="#516775" stroke-width=".8"/>
<text x="180.0" y="160.5" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700">8. Verify citations</text>
<text x="180.0" y="171.5" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="400">Revision, span, hash</text>
<rect x="253" y="142" width="100" height="42" rx="3" fill="#edf3f7" stroke="#516775" stroke-width=".8"/>
<text x="303.0" y="160.5" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700">9. Emit status</text>
<text x="303.0" y="171.5" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="400">Answer or abstention</text>
