<text x="113.0" y="49" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700">Expired / 17 days</text>
<polyline points="38,55 56,55" fill="none" stroke="#516775" stroke-width=".95" stroke-dasharray="3 2"/>
<text x="47.0" y="74" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="400">03 Feb 2025</text>
<rect x="170" y="84" width="114" height="9" rx="1" fill="#def1ea" stroke="#17655d" stroke-width=".8"/>
<text x="227.0" y="81" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700">Effective / 23 days</text>
<polyline points="147,87 170,87" fill="none" stroke="#516775" stroke-width=".95" stroke-dasharray="3 2"/>
