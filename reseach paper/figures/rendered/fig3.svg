<svg xmlns="http://www.w3.org/2000/svg" width="360" height="172" viewBox="0 0 360 172" role="img"><title>Three fictional policy validity intervals, with publication marks and a query date</title>
<text x="180" y="12" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700">Fictional annual leave policy</text>
<polyline points="26,143 340,143" fill="none" stroke="#516775" stroke-width=".95"/>
<polyline points="335.4551712516256,140.91564598785394 340,143 335.4551712516256,145.08435401214606" fill="none" stroke="#516775" stroke-width=".95"/>
<polyline points="56,139 56,147" fill="none" stroke="#516775" stroke-width=".95"/>
<text x="56" y="158" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="400">Apr 2025</text>
<polyline points="170,139 170,147" fill="none" stroke="#516775" stroke-width=".95"/>
<text x="170" y="158" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="400">Apr 2026</text>
<polyline points="284,139 284,147" fill="none" stroke="#516775" stroke-width=".95"/>
<text x="284" y="158" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="400">Apr 2027</text>
