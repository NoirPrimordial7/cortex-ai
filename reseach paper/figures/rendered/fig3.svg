<rect x="284" y="116" width="51" height="9" rx="1" fill="#edf3f7" stroke="#516775" stroke-width=".8"/>
<text x="309.5" y="113" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700">Future / 27 days</text>
<polyline points="227,119 284,119" fill="none" stroke="#516775" stroke-width=".95" stroke-dasharray="3 2"/>
<text x="255.5" y="138" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" font-weight="400">01 Oct 2026</text>
<polyline points="243,30 243,69" fill="none" stroke="#17655d" stroke-width=".95" stroke-dasharray="3 2"/>
<polyline points="245.08435401214606,64.45517125162557 243,69 240.91564598785394,64.45517125162557" fill="none" stroke="#17655d" stroke-width=".95" stroke-dasharray="3 2"/>
<polyline points="335,120.5 349,120.5" fill="none" stroke="#516775" stroke-width=".95"/>
<polyline points="344.4551712516256,118.41564598785395 349,120.5 344.4551712516256,122.58435401214605" fill="none" stroke="#516775" stroke-width=".95"/>
<text x="243" y="25" fill="#17655d" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700">Query: 20 Nov 2026</text>
<text x="180" y="170" fill="#173047" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" font-weight="400">Dashed lead-in: issue date. Bounded effective intervals exclude the end date.</text>
